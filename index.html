<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto Padel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222; --border: rgba(255,255,255,0.07);
  --text: #f0f0f0; --muted: #777; --gold: #f5c842; --silver: #b0b8c1; --bronze: #cd7f32;
  --green: #4ade80; --red: #f87171; --blue: #60a5fa; --orange: #fb923c; --accent: #f5c842;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:3px;font-size:12px;}

/* Header */
header{padding:2rem 2rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;letter-spacing:.05em;color:var(--accent);line-height:1;}
.logo span{color:var(--text);}
.subtitle{font-size:12px;color:var(--muted);margin-top:3px;}
.refresh-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .2s;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 2rem;}
.tab{padding:12px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

main{max-width:960px;margin:0 auto;padding:1.75rem 1.5rem;}
.page{display:none;}.page.active{display:block;}
.section-label{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.1em;color:var(--muted);margin-bottom:.85rem;border-left:3px solid var(--accent);padding-left:9px;}

/* Podio */
.podium-wrap{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-bottom:2rem;}
.podium-item{display:flex;flex-direction:column;align-items:center;gap:6px;}
.podium-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;letter-spacing:.05em;}
.av-1{width:62px;height:62px;font-size:20px;background:rgba(245,200,66,.15);color:var(--gold);border:2px solid var(--gold);}
.av-2{width:52px;height:52px;font-size:17px;background:rgba(176,184,193,.1);color:var(--silver);border:2px solid var(--silver);}
.av-3{width:46px;height:46px;font-size:15px;background:rgba(205,127,50,.1);color:var(--bronze);border:2px solid var(--bronze);}
.podium-name{font-size:13px;font-weight:600;}
.podium-pct{font-size:11px;color:var(--muted);}
.podium-base{border-radius:6px 6px 0 0;width:68px;display:flex;align-items:center;justify-content:center;}
.base-1{height:64px;background:rgba(245,200,66,.18);border:1px solid rgba(245,200,66,.28);}
.base-2{height:46px;background:rgba(176,184,193,.1);border:1px solid rgba(176,184,193,.18);}
.base-3{height:32px;background:rgba(205,127,50,.1);border:1px solid rgba(205,127,50,.18);}
.base-num{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;opacity:.55;}

/* Stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:9px;margin-bottom:1.75rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.stat-val{font-size:18px;font-weight:600;color:var(--text);}
.stat-val .hl{font-size:12px;margin-left:3px;}
.hl-g{color:var(--green);}.hl-r{color:var(--red);}.hl-b{color:var(--blue);}.hl-o{color:var(--orange);}

/* Ranking table */
.rank-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:1.75rem;}
table{width:100%;border-collapse:collapse;}
thead th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:11px 12px;text-align:left;border-bottom:1px solid var(--border);font-weight:500;}
thead th.r{text-align:right;}thead th.c{text-align:center;}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.03);}
tbody td{padding:10px 12px;font-size:13px;vertical-align:middle;}
tbody td.r{text-align:right;}tbody td.c{text-align:center;}
.rank-num{color:var(--muted);font-size:12px;width:20px;}
.rank-name{font-weight:600;font-size:14px;cursor:pointer;}
.rank-name:hover{color:var(--accent);}
.pct-wrap{display:inline-flex;align-items:center;gap:5px;}
.pbar{width:60px;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.pbar-fill{height:4px;border-radius:2px;}
.pct-text{font-size:12px;color:var(--muted);min-width:36px;}
.dots{display:flex;gap:3px;align-items:center;}
.d{width:7px;height:7px;border-radius:50%;}
.d-w{background:var(--green);}.d-l{background:rgba(255,255,255,.12);}
.streak{font-size:11px;color:var(--muted);}
.si-w{color:var(--green);font-size:9px;}.si-l{color:var(--red);font-size:9px;}
.wl{font-size:11px;color:var(--muted);}
.chg-up{background:rgba(74,222,128,.12);color:var(--green);border-radius:4px;font-size:10px;padding:2px 5px;font-weight:600;}
.chg-dn{background:rgba(248,113,113,.12);color:var(--red);border-radius:4px;font-size:10px;padding:2px 5px;font-weight:600;}
.chg-eq{color:var(--muted);font-size:10px;padding:2px 5px;}

/* Chart */
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem;margin-bottom:1.75rem;}
.chart-wrap{position:relative;width:100%;}

/* Matrix */
.matrix-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:1.5rem;}
.matrix-head{padding:.9rem 1.1rem .5rem;}
.matrix-scroll{overflow-x:auto;padding:.5rem 1.1rem 1.1rem;}
.mtable{border-collapse:collapse;font-size:11px;white-space:nowrap;}
.mtable th{font-size:10px;color:var(--muted);padding:4px 7px;text-align:center;font-weight:500;}
.mtable td{padding:4px 7px;text-align:center;min-width:28px;}
.mtable .row-lbl{text-align:left;color:var(--text);font-weight:500;padding-right:10px;}
.mtable .dash-c{color:#333;}

/* Historial */
.fecha-group{margin-bottom:1.5rem;}
.fecha-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem .9rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px 10px 0 0;cursor:pointer;}
.fecha-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.08em;color:var(--accent);}
.fecha-summary{font-size:11px;color:var(--muted);}
.fecha-toggle{color:var(--muted);font-size:12px;transition:transform .2s;}
.fecha-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;overflow:hidden;}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;}
.match-row:last-child{border-bottom:none;}
.match-team{display:flex;flex-direction:column;gap:2px;}
.match-team.winner .team-names{color:var(--green);font-weight:600;}
.match-team.loser .team-names{color:var(--muted);}
.team-names{font-size:12px;}
.match-score{text-align:center;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--text);letter-spacing:.05em;white-space:nowrap;}
.match-team-b{text-align:right;}
.match-team-b .team-names{text-align:right;}

/* Player profile */
.player-select-wrap{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1.5rem;}
.player-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .2s;}
.player-btn:hover{border-color:var(--accent);color:var(--text);}
.player-btn.active{background:rgba(245,200,66,.12);border-color:var(--accent);color:var(--accent);font-weight:600;}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:1.5rem;}
.profile-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;}
.profile-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.profile-val{font-size:22px;font-weight:600;color:var(--text);}
.profile-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.profile-chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.1rem;margin-bottom:1.5rem;}

/* Loader/Error */
.loader{text-align:center;padding:4rem;color:var(--muted);}
.loader-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin:0 3px;animation:pulse 1.2s ease-in-out infinite;}
.loader-dot:nth-child(2){animation-delay:.2s;}.loader-dot:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.err-box{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:12px;padding:1.5rem;color:#fca5a5;line-height:1.7;}
.err-box strong{color:var(--red);}
.updated{font-size:11px;color:var(--muted);text-align:right;margin-top:.75rem;padding-bottom:.5rem;}

@media(max-width:520px){
  .logo{font-size:2rem;} main{padding:1.25rem 1rem;}
  .tab{padding:10px 12px;font-size:12px;}
  .pbar{width:40px;} .match-score{font-size:.9rem;}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Proyecto <span>Padel</span></div>
    <div class="subtitle">Estadísticas en vivo · actualiza solo con cada partido</div>
  </div>
  <button class="refresh-btn" onclick="loadData()">↺ Actualizar</button>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('ranking',this)">Ranking</div>
  <div class="tab" onclick="switchTab('historial',this)">Historial</div>
  <div class="tab" onclick="switchTab('jugador',this)">Por jugador</div>
</div>

<main>
  <div id="root"><div class="loader">
    <span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span>
    <p style="margin-top:1.5rem;font-size:14px">Cargando datos...</p>
  </div></div>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycby2WfugbFIZLjzEwfK1olYYTCGdf4CoQEZ51n3ngq06jCCA3GP1HaaLMxSXbUge8UuO/exec';
let chartInst = null, profileChartInst = null;
let globalData = null;
let currentTab = 'ranking';
let selectedPlayer = null;

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const pg = document.getElementById('page-' + tab);
  if (pg) pg.classList.add('active');
}

function initials(n) { const w = n.trim().split(' '); return w.length > 1 ? w[0][0] + w[1][0] : n.slice(0, 2); }
function pColor(p) { return p >= 55 ? '#4ade80' : p >= 50 ? '#60a5fa' : p >= 45 ? '#fb923c' : '#f87171'; }

async function loadData() {
  if (chartInst) { chartInst.destroy(); chartInst = null; }
  if (profileChartInst) { profileChartInst.destroy(); profileChartInst = null; }
  document.getElementById('root').innerHTML = `<div class="loader">
    <span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span>
    <p style="margin-top:1.5rem;font-size:14px">Conectando con Google Sheets...</p>
  </div>`;
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (!Array.isArray(json) || !json.length) throw new Error('Sin datos');
    globalData = json;
    renderAll(json);
  } catch(e) {
    document.getElementById('root').innerHTML = `<div class="err-box">
      <strong>No se pudo conectar</strong><br><br>
      ${e.message}<br><br>
      Verificá que en Apps Script la implementación sea "Cualquier persona" y que la hoja se llame <code>Hoja1</code>.<br><br>
      <button onclick="loadData()" style="background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);color:#fca5a5;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px;margin-top:.5rem">Reintentar</button>
    </div>`;
  }
}

function computeStats(rows) {
  const stats = {}, rivals = {}, pwins = {}, plosses = {};
  const fechas = {};

  rows.forEach(r => {
    const j1a = String(r['Jugador 1 (A)'] || '').trim();
    const j2a = String(r['Jugador 2 (A)'] || '').trim();
    const sa  = parseInt(r['Sets A']) || 0;
    const j1b = String(r['Jugador 1 (B)'] || '').trim();
    const j2b = String(r['Jugador 2 (B)'] || '').trim();
    const sb  = parseInt(r['Sets B']) || 0;
    const g   = String(r['Ganador'] || '').trim();
    const fecha = String(r['Fecha'] || '').trim();
    if (!j1a || !j2a || !j1b || !j2b || !g) return;

    [j1a, j2a, j1b, j2b].forEach(p => {
      if (!stats[p]) stats[p] = { w:0, l:0, res:[], gf:0, ga:0, pgp_sets:[], partidos:0 };
    });

    const winA = g === 'Pareja A';

    // Team A stats
    [j1a, j2a].forEach(p => {
      const s = stats[p];
      s.res.push(winA ? 1 : 0);
      winA ? s.w++ : s.l++;
      s.partidos++;
      s.gf += sa; s.ga += sb;
      s.pgp_sets.push(sa + sb);
    });
    // Team B stats
    [j1b, j2b].forEach(p => {
      const s = stats[p];
      s.res.push(winA ? 0 : 1);
      winA ? s.l++ : s.w++;
      s.partidos++;
      s.gf += sb; s.ga += sa;
      s.pgp_sets.push(sa + sb);
    });

    // Partner wins/losses
    const pa = [j1a, j2a].sort().join('|');
    const pb = [j1b, j2b].sort().join('|');
    if (!pwins[pa]) pwins[pa] = 0; if (!plosses[pa]) plosses[pa] = 0;
    if (!pwins[pb]) pwins[pb] = 0; if (!plosses[pb]) plosses[pb] = 0;
    if (winA) { pwins[pa]++; plosses[pb]++; } else { plosses[pa]++; pwins[pb]++; }

    // Rivals: losses against opponent
    // For each player on winning team, count loss for each player on losing team
    const winners = winA ? [j1a, j2a] : [j1b, j2b];
    const losers  = winA ? [j1b, j2b] : [j1a, j2a];
    losers.forEach(loser => {
      winners.forEach(winner => {
        const key = [loser, winner].join('->');
        if (!rivals[key]) rivals[key] = 0;
        rivals[key]++;
      });
    });

    // Historial by fecha
    if (!fechas[fecha]) fechas[fecha] = [];
    fechas[fecha].push({ j1a, j2a, sa, j1b, j2b, sb, g });
  });

  return { stats, rivals, pwins, plosses, fechas };
}

function buildRanking(stats, prevStats) {
  return Object.keys(stats).map(p => {
    const s = stats[p];
    const tot = s.w + s.l;
    const pct = tot > 0 ? (s.w / tot) * 100 : 0;
    const dgr = tot > 0 ? (s.gf - s.ga) / tot : 0;
    const pgpp = s.pgp_sets.length > 0 ? s.pgp_sets.reduce((a,b) => a+b, 0) / s.pgp_sets.length : 0;
    let streak = 0, st = 'w';
    for (let i = s.res.length - 1; i >= 0; i--) {
      if (i === s.res.length - 1) { st = s.res[i] ? 'w' : 'l'; streak = 1; }
      else if ((st==='w' && s.res[i]===1) || (st==='l' && s.res[i]===0)) streak++;
      else break;
    }
    return { name:p, pct, w:s.w, l:s.l, tot, gf:s.gf, ga:s.ga, dgr, pgpp, last5:s.res.slice(-5), streak, st };
  }).sort((a, b) => b.pct - a.pct).map((r, i) => {
    const pos = i + 1;
    let chg = 0;
    if (prevStats && prevStats[r.name] !== undefined) {
      chg = prevStats[r.name] - pos; // positive = went up
    }
    return { ...r, pos, chg };
  });
}

function renderAll(rows) {
  const { stats, rivals, pwins, plosses, fechas } = computeStats(rows);

  // Compute prev ranking (exclude last fecha)
  const fechaKeys = Object.keys(fechas);
  let prevPosMap = null;
  if (fechaKeys.length >= 2) {
    const lastFecha = fechaKeys[fechaKeys.length - 1];
    const prevRows = rows.filter(r => String(r['Fecha']||'').trim() !== lastFecha);
    const { stats: prevStats } = computeStats(prevRows);
    const prevRanking = buildRanking(prevStats, null);
    prevPosMap = {};
    prevRanking.forEach(r => prevPosMap[r.name] = r.pos);
  }

  const ranking = buildRanking(stats, prevPosMap);
  const allP = ranking.map(r => r.name);

  // ---- Build rivals matrix: losses against each opponent ----
  function getRivalLosses(loser, winner) {
    return rivals[loser + '->' + winner] || 0;
  }

  // HTML pages
  document.getElementById('root').innerHTML = `
    <div id="page-ranking" class="page active">
      ${renderRankingPage(ranking, allP, pwins, plosses, getRivalLosses)}
    </div>
    <div id="page-historial" class="page">
      ${renderHistorialPage(fechas)}
    </div>
    <div id="page-jugador" class="page">
      ${renderJugadorPage(ranking)}
    </div>
    <p class="updated">Actualizado: ${new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</p>`;

  // Activate correct tab
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + currentTab)?.classList.add('active');

  // Init ranking chart
  initWinChart(ranking);

  // Attach fecha toggles
  document.querySelectorAll('.fecha-header').forEach(h => {
    h.addEventListener('click', () => {
      const body = h.nextElementSibling;
      const tog = h.querySelector('.fecha-toggle');
      const open = body.style.display !== 'none';
      body.style.display = open ? 'none' : 'block';
      tog.style.transform = open ? '' : 'rotate(180deg)';
    });
  });

  // Attach player buttons
  document.querySelectorAll('.player-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedPlayer = btn.dataset.player;
      renderPlayerProfile(selectedPlayer, ranking, rivals, allP);
    });
  });

  // Auto-select first player
  if (ranking.length > 0) {
    selectedPlayer = ranking[0].name;
    document.querySelector('.player-btn')?.classList.add('active');
    renderPlayerProfile(selectedPlayer, ranking, rivals, allP);
  }

  // Name click → jugador tab
  document.querySelectorAll('.rank-name').forEach(el => {
    el.addEventListener('click', () => {
      const pname = el.dataset.player;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab')[2].classList.add('active');
      switchTab('jugador', document.querySelectorAll('.tab')[2]);
      document.querySelectorAll('.player-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.player === pname);
      });
      selectedPlayer = pname;
      renderPlayerProfile(pname, ranking, rivals, allP);
    });
  });
}

function renderRankingPage(ranking, allP, pwins, plosses, getRivalLosses) {
  const top3 = ranking.slice(0, 3);
  const order = [1, 0, 2], avCl = ['av-1','av-2','av-3'], bCl = ['base-1','base-2','base-3'];

  let podHtml = '<div class="podium-wrap">';
  order.forEach(idx => {
    if (!top3[idx]) return;
    const r = top3[idx];
    podHtml += `<div class="podium-item">
      <div class="podium-avatar ${avCl[idx]}">${initials(r.name)}</div>
      <span class="podium-name">${r.name}</span>
      <span class="podium-pct">${r.pct.toFixed(1)}%</span>
      <div class="podium-base ${bCl[idx]}"><span class="base-num">${idx+1}</span></div>
    </div>`;
  });
  podHtml += '</div>';

  const bestS = ranking.reduce((a, b) => b.streak > a.streak ? b : a);
  const mostP = ranking.reduce((a, b) => b.tot > a.tot ? b : a);
  let bestPair = '', bestPW = 0;
  Object.entries(pwins).forEach(([k,v]) => { if (v > bestPW) { bestPW = v; bestPair = k; } });
  const totalP = Math.round(ranking.reduce((a, r) => a + r.tot, 0) / 2);

  const statsHtml = `<div class="stats-grid">
    <div class="stat-card"><p class="stat-label">Líder</p><p class="stat-val">${ranking[0].name} <span class="hl hl-g">${ranking[0].pct.toFixed(1)}%</span></p></div>
    <div class="stat-card"><p class="stat-label">Racha activa</p><p class="stat-val">${bestS.name} <span class="hl ${bestS.st==='w'?'hl-g':'hl-r'}">x${bestS.streak}</span></p></div>
    <div class="stat-card"><p class="stat-label">Mejor pareja</p><p class="stat-val" style="font-size:15px">${bestPair.replace('|',' + ')} <span class="hl hl-g">${bestPW}W</span></p></div>
    <div class="stat-card"><p class="stat-label">Total partidos</p><p class="stat-val">${totalP} <span class="hl hl-b">jugados</span></p></div>
  </div>`;

  let tbody = '';
  ranking.forEach(r => {
    const dots = r.last5.map(w => `<span class="d ${w?'d-w':'d-l'}"></span>`).join('');
    const sIcon = r.st==='w' ? `<span class="si-w">▲</span>` : `<span class="si-l">▼</span>`;
    let chgHtml = `<span class="chg-eq">—</span>`;
    if (r.chg > 0) chgHtml = `<span class="chg-up">+${r.chg} ▲</span>`;
    else if (r.chg < 0) chgHtml = `<span class="chg-dn">${r.chg} ▼</span>`;
    tbody += `<tr>
      <td class="rank-num">${r.pos}</td>
      <td><span class="rank-name" data-player="${r.name}">${r.name}</span></td>
      <td class="r"><div class="pct-wrap">
        <span class="pbar"><span class="pbar-fill" style="width:${r.pct.toFixed(0)}%;background:${pColor(r.pct)}"></span></span>
        <span class="pct-text">${r.pct.toFixed(1)}%</span>
      </div></td>
      <td class="c"><div class="dots">${dots}</div></td>
      <td class="c">${sIcon} <span class="streak">${r.streak}</span></td>
      <td class="r wl">${r.w}W/${r.l}L</td>
      <td class="c">${chgHtml}</td>
    </tr>`;
  });

  const tableHtml = `<div class="rank-table-wrap"><table>
    <thead><tr><th>#</th><th>Jugador</th><th class="r">%</th><th class="c">Últimos 5</th><th class="c">Racha</th><th class="r">W/L</th><th class="c">Pos</th></tr></thead>
    <tbody>${tbody}</tbody>
  </table></div>`;

  const chartHtml = `<div class="chart-box">
    <p class="section-label" style="margin-bottom:1rem">% victorias</p>
    <div class="chart-wrap" style="height:${Math.max(180, ranking.length * 26)}px">
      <canvas id="wc" role="img" aria-label="Porcentaje de victorias por jugador"></canvas>
    </div>
  </div>`;

  // Partner wins matrix
  const wMatHtml = buildMatrixHTML(allP, (a,b) => {
    if(a===b) return null;
    return pwins[[a,b].sort().join('|')] || 0;
  }, true);

  // Rivals losses matrix
  const rMatHtml = buildMatrixHTML(allP, (a,b) => {
    if(a===b) return null;
    return getRivalLosses(a, b);
  }, false);

  return `
    <p class="section-label">Podio</p>${podHtml}
    <p class="section-label">Estadísticas</p>${statsHtml}
    <p class="section-label">Ranking</p>${tableHtml}
    ${chartHtml}
    <p class="section-label">Victorias como compañeros</p>
    <div class="matrix-box"><div class="matrix-scroll">${wMatHtml}</div></div>
    <p class="section-label" style="margin-top:1.5rem">Derrotas contra rivales</p>
    <div class="matrix-box"><div class="matrix-scroll">${rMatHtml}</div></div>`;
}

function buildMatrixHTML(allP, valFn, isWin) {
  const vals = allP.map(a => allP.map(b => valFn(a, b)));
  const flat = vals.flat().filter(v => v !== null);
  const maxV = flat.length ? Math.max(...flat) : 1;
  const sh = allP.map(p => p.length > 6 ? p.slice(0,6) : p);
  let h = `<table class="mtable"><thead><tr><th></th>`;
  sh.forEach(s => h += `<th>${s}</th>`);
  h += '</tr></thead><tbody>';
  allP.forEach((p, i) => {
    h += `<tr><td class="row-lbl">${p}</td>`;
    vals[i].forEach(v => {
      if (v === null) { h += `<td class="dash-c">—</td>`; return; }
      const al = maxV > 0 && v > 0 ? 0.1 + (v / maxV) * 0.85 : 0;
      const bg = isWin ? `rgba(74,222,128,${al.toFixed(2)})` : `rgba(248,113,113,${al.toFixed(2)})`;
      const col = v > maxV * .6 ? (isWin ? '#052e16' : '#450a0a') : (isWin ? '#86efac' : '#fca5a5');
      h += `<td style="background:${bg};color:${v>0?col:'#444'};font-weight:${v>0?600:400}">${v}</td>`;
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  return h;
}

function renderHistorialPage(fechas) {
  const keys = Object.keys(fechas).reverse();
  if (!keys.length) return '<p style="color:var(--muted);font-size:14px">Sin datos de fechas.</p>';

  let html = '';
  keys.forEach((fecha, fi) => {
    const matches = fechas[fecha];
    const wins = { 'Pareja A': 0, 'Pareja B': 0 };
    matches.forEach(m => wins[m.g]++);
    let matchesHtml = '';
    matches.forEach(m => {
      const winA = m.g === 'Pareja A';
      matchesHtml += `<div class="match-row">
        <div class="match-team ${winA?'winner':'loser'}">
          <div class="team-names">${m.j1a} / ${m.j2a}</div>
        </div>
        <div class="match-score">${m.sa} — ${m.sb}</div>
        <div class="match-team match-team-b ${!winA?'winner':'loser'}">
          <div class="team-names">${m.j1b} / ${m.j2b}</div>
        </div>
      </div>`;
    });
    html += `<div class="fecha-group">
      <div class="fecha-header">
        <span class="fecha-title">${fecha}</span>
        <span style="display:flex;align-items:center;gap:12px">
          <span class="fecha-summary">${matches.length} partidos</span>
          <span class="fecha-toggle">▼</span>
        </span>
      </div>
      <div class="fecha-body" style="display:${fi===0?'block':'none'}">${matchesHtml}</div>
    </div>`;
  });
  return html;
}

function renderJugadorPage(ranking) {
  const btnHtml = ranking.map(r =>
    `<button class="player-btn" data-player="${r.name}">${r.name}</button>`
  ).join('');
  return `
    <div class="player-select-wrap">${btnHtml}</div>
    <div id="player-profile"><p style="color:var(--muted);font-size:14px">Seleccioná un jugador.</p></div>`;
}

function renderPlayerProfile(pname, ranking, rivals, allP) {
  const r = ranking.find(x => x.name === pname);
  if (!r) return;

  const dif = r.gf - r.ga;
  const difStr = dif >= 0 ? `+${dif}` : `${dif}`;
  const dgr = r.dgr >= 0 ? `+${r.dgr.toFixed(2)}` : r.dgr.toFixed(2);

  // Worst rival (most losses against)
  let worstRival = '', worstCount = 0;
  allP.forEach(opp => {
    if (opp === pname) return;
    const l = rivals[pname + '->' + opp] || 0;
    if (l > worstCount) { worstCount = l; worstRival = opp; }
  });
  // Best rival (most wins against)
  let bestRival = '', bestCount = 0;
  allP.forEach(opp => {
    if (opp === pname) return;
    const w = rivals[opp + '->' + pname] || 0; // opp lost against pname
    if (w > bestCount) { bestCount = w; bestRival = opp; }
  });

  const cardsHtml = `<div class="profile-grid">
    <div class="profile-card"><p class="profile-label">Posición</p><p class="profile-val">#${r.pos}</p><p class="profile-sub">${r.pct.toFixed(1)}% efectividad</p></div>
    <div class="profile-card"><p class="profile-label">Partidos</p><p class="profile-val">${r.tot}</p><p class="profile-sub">${r.w}W / ${r.l}L</p></div>
    <div class="profile-card"><p class="profile-label">Dif. games</p><p class="profile-val" style="color:${dif>=0?'var(--green)':'var(--red)'}">${difStr}</p><p class="profile-sub">${r.gf} a favor / ${r.ga} en contra</p></div>
    <div class="profile-card"><p class="profile-label">DGR</p><p class="profile-val" style="color:${r.dgr>=0?'var(--green)':'var(--red)'}">${dgr}</p><p class="profile-sub">Dif. games por partido</p></div>
    <div class="profile-card"><p class="profile-label">PGPP</p><p class="profile-val">${r.pgpp.toFixed(1)}</p><p class="profile-sub">Games por partido</p></div>
    <div class="profile-card"><p class="profile-label">Ratio G</p><p class="profile-val">${r.ga>0?(r.gf/r.ga).toFixed(2):'—'}</p><p class="profile-sub">Games a favor / en contra</p></div>
    ${worstRival?`<div class="profile-card"><p class="profile-label">Peor rival</p><p class="profile-val" style="font-size:16px">${worstRival}</p><p class="profile-sub">${worstCount} derrotas contra él/ella</p></div>`:''}
    ${bestRival?`<div class="profile-card"><p class="profile-label">Mejor rival</p><p class="profile-val" style="font-size:16px">${bestRival}</p><p class="profile-sub">${bestCount} victorias contra él/ella</p></div>`:''}
  </div>`;

  // Last results chart
  const last10 = r.last5.slice(-10); // grab up to last 10 from full res
  const allRes = globalData ? (() => {
    const s = {}; computeStats(globalData).stats[pname]?.res || [];
    return computeStats(globalData).stats[pname]?.res || [];
  })() : r.last5;
  const chartData = allRes.slice(-10);

  if (profileChartInst) { profileChartInst.destroy(); profileChartInst = null; }

  const chartHtml = `<div class="profile-chart-wrap">
    <p class="section-label" style="margin-bottom:1rem">Últimos ${chartData.length} resultados</p>
    <div style="position:relative;height:120px"><canvas id="profileChart" role="img" aria-label="Resultados recientes del jugador"></canvas></div>
  </div>`;

  document.getElementById('player-profile').innerHTML = cardsHtml + chartHtml;

  const labels = chartData.map((_, i) => `P${allRes.length - chartData.length + i + 1}`);
  profileChartInst = new Chart(document.getElementById('profileChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: chartData.map(v => v === 1 ? 1 : -1),
        backgroundColor: chartData.map(v => v === 1 ? 'rgba(74,222,128,.7)' : 'rgba(248,113,113,.7)'),
        borderRadius: 4, borderSkipped: false
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ctx.raw === 1 ? ' Victoria' : ' Derrota' } } },
      scales: {
        y: { min: -1.5, max: 1.5, ticks: { display: false }, grid: { color: 'rgba(255,255,255,.04)' }, border: { display: false } },
        x: { ticks: { color: '#666', font: { size: 10 } }, grid: { display: false }, border: { display: false } }
      }
    }
  });
}

function initWinChart(ranking) {
  if (chartInst) { chartInst.destroy(); chartInst = null; }
  const canvas = document.getElementById('wc');
  if (!canvas) return;
  chartInst = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: ranking.map(r => r.name),
      datasets: [{
        data: ranking.map(r => parseFloat(r.pct.toFixed(1))),
        backgroundColor: ranking.map(r => pColor(r.pct)),
        borderRadius: 5, borderSkipped: false
      }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.raw}%` } } },
      scales: {
        x: { min: 0, max: 90, ticks: { callback: v => v + '%', color: '#666', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,.04)' }, border: { display: false } },
        y: { ticks: { color: '#ccc', font: { size: 11, family: 'DM Sans' } }, grid: { display: false }, border: { display: false } }
      }
    }
  });
}

loadData();
</script>
</body>
</html>
