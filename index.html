<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto Padel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:rgba(255,255,255,0.07);--text:#f0f0f0;--muted:#777;--gold:#f5c842;--silver:#b0b8c1;--bronze:#cd7f32;--green:#4ade80;--red:#f87171;--blue:#60a5fa;--orange:#fb923c;--accent:#f5c842;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:3px;font-size:12px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;letter-spacing:.05em;color:var(--accent);line-height:1;}
.logo span{color:var(--text);}
.subtitle{font-size:12px;color:var(--muted);margin-top:3px;}
header{padding:2rem 2rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.refresh-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .2s;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 2rem;}
.tab{padding:12px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.tab:hover{color:var(--text);}.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
main{max-width:960px;margin:0 auto;padding:1.75rem 1.5rem;}
.page{display:none;}.page.active{display:block;}
.sl{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.1em;color:var(--muted);margin-bottom:.85rem;border-left:3px solid var(--accent);padding-left:9px;}
.podium-wrap{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-bottom:2rem;}
.podium-item{display:flex;flex-direction:column;align-items:center;gap:6px;}
.podium-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;letter-spacing:.05em;}
.av-1{width:62px;height:62px;font-size:20px;background:rgba(245,200,66,.15);color:var(--gold);border:2px solid var(--gold);}
.av-2{width:52px;height:52px;font-size:17px;background:rgba(176,184,193,.1);color:var(--silver);border:2px solid var(--silver);}
.av-3{width:46px;height:46px;font-size:15px;background:rgba(205,127,50,.1);color:var(--bronze);border:2px solid var(--bronze);}
.pname{font-size:13px;font-weight:600;}.ppct{font-size:11px;color:var(--muted);}
.podium-base{border-radius:6px 6px 0 0;width:68px;display:flex;align-items:center;justify-content:center;}
.base-1{height:64px;background:rgba(245,200,66,.18);border:1px solid rgba(245,200,66,.28);}
.base-2{height:46px;background:rgba(176,184,193,.1);border:1px solid rgba(176,184,193,.18);}
.base-3{height:32px;background:rgba(205,127,50,.1);border:1px solid rgba(205,127,50,.18);}
.base-num{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;opacity:.55;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:1.75rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.stat-val{font-size:16px;font-weight:600;color:var(--text);line-height:1.3;}
.stat-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.hl-g{color:var(--green);}.hl-r{color:var(--red);}.hl-b{color:var(--blue);}.hl-o{color:var(--orange);}
.rank-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:1.75rem;}
table{width:100%;border-collapse:collapse;}
thead th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:11px 12px;text-align:left;border-bottom:1px solid var(--border);font-weight:500;}
th.r{text-align:right;}th.c{text-align:center;}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;}
tbody tr:last-child{border-bottom:none;}tbody tr:hover{background:rgba(255,255,255,.03);}
tbody td{padding:10px 12px;font-size:13px;vertical-align:middle;}
td.r{text-align:right;}td.c{text-align:center;}
.rnum{color:var(--muted);font-size:12px;width:20px;}.rname{font-weight:600;font-size:14px;cursor:pointer;}
.rname:hover{color:var(--accent);}
.dots{display:flex;gap:3px;align-items:center;}
.d{width:7px;height:7px;border-radius:50%;}.d-w{background:var(--green);}.d-l{background:rgba(255,255,255,.12);}
.streak-cell{display:inline-flex;align-items:center;gap:4px;font-size:13px;}
.streak-num{font-size:11px;}
.chg-up{background:rgba(74,222,128,.12);color:var(--green);border-radius:4px;font-size:10px;padding:2px 5px;font-weight:600;}
.chg-dn{background:rgba(248,113,113,.12);color:var(--red);border-radius:4px;font-size:10px;padding:2px 5px;font-weight:600;}
.chg-eq{color:var(--muted);font-size:10px;}
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem;margin-bottom:1.75rem;}
.matrix-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:1.5rem;}
.matrix-scroll{overflow-x:auto;padding:.75rem 1.1rem 1.1rem;}
.mt{border-collapse:collapse;font-size:10px;white-space:nowrap;}
.mt th{font-size:9px;color:var(--muted);padding:3px 6px;text-align:center;font-weight:500;}
.mt td{padding:3px 6px;text-align:center;min-width:28px;}
.mt .rl{text-align:left;color:var(--text);font-weight:500;padding-right:10px;}
.mt .dc{color:#333;}
.fecha-group{margin-bottom:1.25rem;}
.fecha-hdr{display:flex;align-items:center;justify-content:space-between;padding:.6rem .9rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px 10px 0 0;cursor:pointer;}
.fecha-ttl{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.08em;color:var(--accent);}
.fecha-tog{color:var(--muted);font-size:12px;transition:transform .2s;}
.fecha-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;overflow:hidden;}
.mvp-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(245,200,66,.06);border-bottom:1px solid var(--border);}
.mvp-label{font-size:10px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.mvp-name{font-size:12px;color:var(--text);font-weight:600;}
.mvp-stat{font-size:11px;color:var(--muted);}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;}
.match-row:last-child{border-bottom:none;}
.mt-w .tnames{color:var(--green);font-weight:600;}.mt-l .tnames{color:var(--muted);}
.tnames{font-size:12px;}.tnames-r{text-align:right;}
.mscore{text-align:center;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--text);white-space:nowrap;}
.player-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;}
.pbtn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;transition:all .2s;font-family:inherit;}
.pbtn:hover{border-color:var(--accent);color:var(--text);}.pbtn.active{background:rgba(245,200,66,.12);border-color:var(--accent);color:var(--accent);font-weight:600;}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:1.25rem;}
.profile-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;}
.plabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.pval{font-size:22px;font-weight:600;color:var(--text);}
.psub{font-size:11px;color:var(--muted);margin-top:2px;}
.info-btn{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--muted);font-size:9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);flex-shrink:0;font-style:normal;}
.tooltip-wrap{position:relative;display:inline-flex;}
.tooltip-box{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#2a2a2a;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--muted);line-height:1.5;width:190px;z-index:100;pointer-events:none;}
.tooltip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#2a2a2a;}
.tooltip-wrap:hover .tooltip-box{display:block;}
.glossary{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1.5rem;}
.glossary-title{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.06em;}
.glossary-item{display:flex;gap:10px;padding:.45rem 0;border-bottom:1px solid var(--border);align-items:baseline;}
.glossary-item:last-child{border-bottom:none;}
.g-term{font-size:12px;font-weight:600;color:var(--accent);min-width:62px;}
.g-def{font-size:12px;color:var(--muted);line-height:1.5;}
.min-notice{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin-bottom:1rem;display:inline-block;}
.loader{text-align:center;padding:4rem;color:var(--muted);}
.loader-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin:0 3px;animation:pulse 1.2s ease-in-out infinite;}
.loader-dot:nth-child(2){animation-delay:.2s;}.loader-dot:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.err-box{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:12px;padding:1.5rem;color:#fca5a5;line-height:1.7;}
.err-box strong{color:var(--red);}
.updated{font-size:11px;color:var(--muted);text-align:right;margin-top:.75rem;padding-bottom:.5rem;}
@media(max-width:600px){
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .logo{font-size:2rem;} main{padding:1.25rem 1rem;}
  .tab{padding:10px 12px;font-size:12px;}
  .hide-m{display:none;}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Proyecto <span>Padel</span></div>
    <div class="subtitle">Estadísticas en vivo · se actualiza con cada partido</div>
  </div>
  <button class="refresh-btn" onclick="loadData()">↺ Actualizar</button>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('ranking',this)">Ranking</div>
  <div class="tab" onclick="switchTab('historial',this)">Historial</div>
  <div class="tab" onclick="switchTab('jugador',this)">Por jugador</div>
</div>

<main>
  <div id="root"><div class="loader">
    <span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span>
    <p style="margin-top:1.5rem;font-size:14px">Cargando datos...</p>
  </div></div>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycby2WfugbFIZLjzEwfK1olYYTCGdf4CoQEZ51n3ngq06jCCA3GP1HaaLMxSXbUge8UuO/exec';
const MIN_PARTIDOS = 10;

let chartInst=null, profChartInst=null, evoChartInst=null;
let currentTab='ranking', selPlayer=null;

const GLOSSARY=[
  {term:'% Efect.',def:'Porcentaje de partidos ganados sobre el total jugados. Es el indicador principal del ranking.'},
  {term:'Dif. G',def:'Games a favor menos games en contra. Positivo = ganás más games de los que perdés.'},
  {term:'DGR',def:'Diferencia de games relativa: promedio de diferencia de games por partido.'},
  {term:'PGPP',def:'Promedio de games jugados por partido (suma de ambos lados). Mide el volumen de juego.'},
  {term:'Ratio G',def:'Games a favor dividido games en contra. Mayor a 1 = ganás más games de los que perdés.'},
  {term:'Peor rival',def:'Jugador contra quien acumulaste más derrotas cuando estuvo en el equipo contrario.'},
  {term:'Mejor rival',def:'Jugador contra quien acumulaste más victorias cuando estuvo en el equipo contrario.'},
  {term:'Dominante',def:'Jugador con mayor DGR. No solo gana, sino que gana por más games.'},
];

function initials(n){const w=n.trim().split(' ');return w.length>1?w[0][0]+w[1][0]:n.slice(0,2);}
function pColor(p){return p>=55?'#4ade80':p>=50?'#60a5fa':p>=45?'#fb923c':'#f87171';}

function streakCell(st,count){
  const icon=st==='w'&&count>=3?'🔥':st==='l'&&count>=3?'❄️':null;
  const col=st==='w'?'var(--green)':'var(--red)';
  if(icon)return`<span class="streak-cell">${icon}<span class="streak-num" style="color:${col}">${count}</span></span>`;
  return`<span class="streak-cell"><span class="streak-num" style="color:${col}">${count}${st==='w'?'W':'L'}</span></span>`;
}

function switchTab(tab,el){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab)?.classList.add('active');
}

async function loadData(){
  [chartInst,profChartInst,evoChartInst].forEach(c=>{if(c){c.destroy();}});
  chartInst=profChartInst=evoChartInst=null;
  document.getElementById('root').innerHTML=`<div class="loader">
    <span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span>
    <p style="margin-top:1.5rem;font-size:14px">Conectando con Google Sheets...</p>
  </div>`;
  try{
    const res=await fetch(API);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const json=await res.json();
    if(!Array.isArray(json)||!json.length)throw new Error('El script no devolvió datos');
    renderAll(json);
  }catch(e){
    document.getElementById('root').innerHTML=`<div class="err-box">
      <strong>No se pudo cargar el Sheet</strong><br><br>
      Error: ${e.message}<br><br>
      Verificá que en Apps Script:<br>
      • Implementación → "Cualquier persona" puede acceder<br>
      • El script está autorizado<br>
      • El nombre de la hoja es exactamente <code>Hoja1</code><br><br>
      <button onclick="loadData()" style="background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);color:#fca5a5;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;margin-top:.5rem">Reintentar</button>
    </div>`;
  }
}

function computeStats(rows){
  const stats={},rivals={},pwins={},plosses={},fechas={};
  let totalPartidos=0;
  rows.forEach(r=>{
    const j1a=String(r['Jugador 1 (A)']||'').trim(),j2a=String(r['Jugador 2 (A)']||'').trim();
    const sa=parseInt(r['Sets A'])||0;
    const j1b=String(r['Jugador 1 (B)']||'').trim(),j2b=String(r['Jugador 2 (B)']||'').trim();
    const sb=parseInt(r['Sets B'])||0;
    const g=String(r['Ganador']||'').trim(),fecha=String(r['Fecha']||'').trim();
    if(!j1a||!j2a||!j1b||!j2b||!g)return;
    totalPartidos++;
    [j1a,j2a,j1b,j2b].forEach(p=>{if(!stats[p])stats[p]={w:0,l:0,res:[],gf:0,ga:0,pgp_sets:[]};});
    const winA=g==='Pareja A';
    [j1a,j2a].forEach(p=>{stats[p].res.push(winA?1:0);winA?stats[p].w++:stats[p].l++;stats[p].gf+=sa;stats[p].ga+=sb;stats[p].pgp_sets.push(sa+sb);});
    [j1b,j2b].forEach(p=>{stats[p].res.push(winA?0:1);winA?stats[p].l++:stats[p].w++;stats[p].gf+=sb;stats[p].ga+=sa;stats[p].pgp_sets.push(sa+sb);});
    const pa=[j1a,j2a].sort().join('|'),pb=[j1b,j2b].sort().join('|');
    if(!pwins[pa])pwins[pa]=0;if(!plosses[pa])plosses[pa]=0;
    if(!pwins[pb])pwins[pb]=0;if(!plosses[pb])plosses[pb]=0;
    if(winA){pwins[pa]++;plosses[pb]++;}else{plosses[pa]++;pwins[pb]++;}
    const winners=winA?[j1a,j2a]:[j1b,j2b],losers=winA?[j1b,j2b]:[j1a,j2a];
    losers.forEach(lo=>winners.forEach(wi=>{const k=lo+'->'+wi;if(!rivals[k])rivals[k]=0;rivals[k]++;}));
    if(!fechas[fecha])fechas[fecha]=[];
    fechas[fecha].push({j1a,j2a,sa,j1b,j2b,sb,g});
  });
  return{stats,rivals,pwins,plosses,fechas,totalPartidos};
}

function buildRanking(stats,prevPosMap,minP=0){
  return Object.keys(stats)
    .filter(p=>stats[p].w+stats[p].l>=minP)
    .map(p=>{
      const s=stats[p],tot=s.w+s.l,pct=tot>0?(s.w/tot)*100:0;
      const dgr=tot>0?(s.gf-s.ga)/tot:0;
      const pgpp=s.pgp_sets.length>0?s.pgp_sets.reduce((a,b)=>a+b,0)/s.pgp_sets.length:0;
      let streak=0,st='w';
      for(let i=s.res.length-1;i>=0;i--){
        if(i===s.res.length-1){st=s.res[i]?'w':'l';streak=1;}
        else if((st==='w'&&s.res[i]===1)||(st==='l'&&s.res[i]===0))streak++;
        else break;
      }
      return{name:p,pct,w:s.w,l:s.l,tot,gf:s.gf,ga:s.ga,dgr,pgpp,last5:s.res.slice(-5),res:s.res,streak,st};
    }).sort((a,b)=>b.pct-a.pct).map((r,i)=>{
      const pos=i+1,chg=prevPosMap&&prevPosMap[r.name]!==undefined?prevPosMap[r.name]-pos:null;
      return{...r,pos,chg};
    });
}

function computeMVPs(fechas){
  const mvps={};
  Object.entries(fechas).forEach(([fecha,matches])=>{
    const fw={};
    matches.forEach(m=>{
      const winners=m.g==='Pareja A'?[m.j1a,m.j2a]:[m.j1b,m.j2b];
      winners.forEach(p=>{fw[p]=(fw[p]||0)+1;});
    });
    const sorted=Object.entries(fw).sort((a,b)=>b[1]-a[1]);
    if(sorted.length)mvps[fecha]={name:sorted[0][0],wins:sorted[0][1],total:matches.length};
  });
  return mvps;
}

function computeRankingEvolution(rows,allFechas){
  const evolution={};
  const cumul=[];
  allFechas.forEach(fecha=>{
    rows.filter(r=>String(r['Fecha']||'').trim()===fecha).forEach(r=>cumul.push(r));
    const{stats}=computeStats(cumul);
    const rank=buildRanking(stats,null,0);
    rank.forEach(r=>{if(!evolution[r.name])evolution[r.name]=[];evolution[r.name].push(r.pos);});
  });
  return evolution;
}

function matrixHTML(allP,valFn,isWin){
  const vals=allP.map(a=>allP.map(b=>valFn(a,b)));
  const flat=vals.flat().filter(v=>v!==null);
  const maxV=flat.length?Math.max(...flat):1;
  const sh=allP.map(p=>p.length>6?p.slice(0,6):p);
  let h=`<table class="mt"><thead><tr><th></th>`;
  sh.forEach(s=>h+=`<th>${s}</th>`);h+='</tr></thead><tbody>';
  allP.forEach((p,i)=>{
    h+=`<tr><td class="rl">${p}</td>`;
    vals[i].forEach(v=>{
      if(v===null){h+=`<td class="dc">—</td>`;return;}
      const al=maxV>0&&v>0?0.1+(v/maxV)*0.85:0;
      const bg=isWin?`rgba(74,222,128,${al.toFixed(2)})`:`rgba(248,113,113,${al.toFixed(2)})`;
      const col=v>maxV*.6?(isWin?'#052e16':'#450a0a'):(isWin?'#86efac':'#fca5a5');
      h+=`<td style="background:${bg};color:${v>0?col:'#444'};font-weight:${v>0?600:400}">${v}</td>`;
    });h+='</tr>';
  });
  return h+'</tbody></table>';
}

function renderAll(rows){
  const{stats,rivals,pwins,plosses,fechas,totalPartidos}=computeStats(rows);
  const fechaKeys=Object.keys(fechas);

  let prevPosMap=null;
  if(fechaKeys.length>=2){
    const last=fechaKeys[fechaKeys.length-1];
    const{stats:ps}=computeStats(rows.filter(r=>String(r['Fecha']||'').trim()!==last));
    const pr=buildRanking(ps,null,MIN_PARTIDOS);
    prevPosMap={};pr.forEach(r=>prevPosMap[r.name]=r.pos);
  }

  const ranking=buildRanking(stats,prevPosMap,MIN_PARTIDOS);
  const allP=ranking.map(r=>r.name);
  const mvps=computeMVPs(fechas);
  const evoData=computeRankingEvolution(rows,fechaKeys);

  document.getElementById('root').innerHTML=`
    <div id="page-ranking" class="page active"></div>
    <div id="page-historial" class="page"></div>
    <div id="page-jugador" class="page"></div>
    <p class="updated" id="upd"></p>`;

  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+currentTab)?.classList.add('active');

  renderRanking(ranking,allP,pwins,plosses,rivals,fechaKeys,totalPartidos,mvps,stats);
  renderHistorial(fechas,mvps);
  renderJugador(ranking);

  initWinChart(ranking);

  document.querySelectorAll('.fecha-hdr').forEach(h=>{
    h.addEventListener('click',()=>{
      const b=h.nextElementSibling,t=h.querySelector('.fecha-tog');
      const open=b.style.display!=='none';
      b.style.display=open?'none':'block';
      t.style.transform=open?'':'rotate(180deg)';
    });
  });
  document.querySelectorAll('.pbtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');selPlayer=btn.dataset.p;
      renderProfile(selPlayer,ranking,rivals,allP,fechaKeys,evoData,mvps);
    });
  });
  document.querySelectorAll('.rname').forEach(el=>{
    el.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.tab')[2].classList.add('active');
      switchTab('jugador',document.querySelectorAll('.tab')[2]);
      document.querySelectorAll('.pbtn').forEach(b=>b.classList.toggle('active',b.dataset.p===el.dataset.p));
      selPlayer=el.dataset.p;
      renderProfile(selPlayer,ranking,rivals,allP,fechaKeys,evoData,mvps);
    });
  });
  if(ranking.length){
    selPlayer=ranking[0].name;
    document.querySelector('.pbtn')?.classList.add('active');
    renderProfile(selPlayer,ranking,rivals,allP,fechaKeys,evoData,mvps);
  }
  document.getElementById('upd').textContent='Actualizado: '+new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function renderRanking(ranking,allP,pwins,plosses,rivals,fechaKeys,totalPartidos,mvps,stats){
  const top3=ranking.slice(0,3),order=[1,0,2],avCl=['av-1','av-2','av-3'],bCl=['base-1','base-2','base-3'];
  let pod='<div class="podium-wrap">';
  order.forEach(idx=>{
    if(!top3[idx])return;
    const r=top3[idx];
    pod+=`<div class="podium-item"><div class="podium-avatar ${avCl[idx]}">${initials(r.name)}</div>
      <span class="pname">${r.name}</span><span class="ppct">${r.pct.toFixed(1)}%</span>
      <div class="podium-base ${bCl[idx]}"><span class="base-num">${idx+1}</span></div></div>`;
  });pod+='</div>';

  const bestS=ranking.reduce((a,b)=>b.streak>a.streak?b:a,ranking[0]);
  let bPair='',bPW=0,wPair='',wPL=0;
  Object.entries(pwins).forEach(([k,v])=>{
    const[p1,p2]=k.split('|');
    if((stats[p1]?.w+stats[p1]?.l||0)<MIN_PARTIDOS||(stats[p2]?.w+stats[p2]?.l||0)<MIN_PARTIDOS)return;
    if(v>bPW){bPW=v;bPair=k;}
  });
  Object.entries(plosses).forEach(([k,v])=>{
    const[p1,p2]=k.split('|');
    if((stats[p1]?.w+stats[p1]?.l||0)<MIN_PARTIDOS||(stats[p2]?.w+stats[p2]?.l||0)<MIN_PARTIDOS)return;
    if(v>wPL){wPL=v;wPair=k;}
  });
  const dominante=ranking.length?ranking.reduce((a,b)=>b.dgr>a.dgr?b:a,ranking[0]):null;
  const mvpCount={};
  Object.values(mvps).forEach(m=>{mvpCount[m.name]=(mvpCount[m.name]||0)+1;});
  const topMVP=Object.entries(mvpCount).sort((a,b)=>b[1]-a[1])[0];

  const sg=`<div class="stats-grid">
    <div class="stat-card"><p class="stat-label">Mejor pareja</p>
      <p class="stat-val">${bPair.replace('|',' + ')||'—'}</p>
      <p class="stat-sub"><span class="hl-g">${bPW} victorias</span> juntos</p></div>
    <div class="stat-card"><p class="stat-label">Peor pareja</p>
      <p class="stat-val">${wPair.replace('|',' + ')||'—'}</p>
      <p class="stat-sub"><span class="hl-r">${wPL} derrotas</span> juntos</p></div>
    <div class="stat-card"><p class="stat-label">Racha activa</p>
      <p class="stat-val">${bestS?.name||'—'}</p>
      <p class="stat-sub"><span class="${bestS?.st==='w'?'hl-g':'hl-r'}">${bestS?.streak||0} ${bestS?.st==='w'?'victorias':'derrotas'}</span> seguidas</p></div>
    <div class="stat-card"><p class="stat-label">Total partidos</p>
      <p class="stat-val">${totalPartidos}</p>
      <p class="stat-sub"><span class="hl-b">${fechaKeys.length} fechas</span> jugadas</p></div>
    <div class="stat-card"><p class="stat-label">Más dominante 💪</p>
      <p class="stat-val">${dominante?.name||'—'}</p>
      <p class="stat-sub">DGR <span class="hl-g">${dominante?.dgr>=0?'+':''}${dominante?.dgr.toFixed(2)||0}</span> games/partido</p></div>
    <div class="stat-card"><p class="stat-label">Rey de fechas 👑</p>
      <p class="stat-val">${topMVP?topMVP[0]:'—'}</p>
      <p class="stat-sub">MVP en <span class="hl-o">${topMVP?topMVP[1]:0} fecha${topMVP&&topMVP[1]>1?'s':''}</span></p></div>
  </div>`;

  let tbody='';
  ranking.forEach(r=>{
    const dots=r.last5.map(w=>`<span class="d ${w?'d-w':'d-l'}"></span>`).join('');
    const sc=streakCell(r.st,r.streak);
    let chg=`<span class="chg-eq">—</span>`;
    if(r.chg>0)chg=`<span class="chg-up">+${r.chg}▲</span>`;
    else if(r.chg<0)chg=`<span class="chg-dn">${r.chg}▼</span>`;
    tbody+=`<tr>
      <td class="rnum">${r.pos}</td>
      <td><span class="rname" data-p="${r.name}">${r.name}</span></td>
      <td class="r"><span style="color:${pColor(r.pct)};font-weight:600;font-size:13px">${r.pct.toFixed(1)}%</span></td>
      <td class="c hide-m"><div class="dots">${dots}</div></td>
      <td class="c">${sc}</td>
      <td class="r hide-m" style="font-size:11px;color:var(--muted)">${r.w}W/${r.l}L</td>
      <td class="c">${chg}</td>
    </tr>`;
  });

  const tbl=`<span class="min-notice">Solo jugadores con ${MIN_PARTIDOS}+ partidos</span>
  <div class="rank-wrap"><table>
    <thead><tr><th>#</th><th>Jugador</th><th class="r">%</th><th class="c hide-m">Últimos 5</th><th class="c">Racha</th><th class="r hide-m">W/L</th><th class="c">Pos</th></tr></thead>
    <tbody>${tbody}</tbody></table></div>`;

  const wMat=matrixHTML(allP,(a,b)=>a===b?null:pwins[[a,b].sort().join('|')]||0,true);
  const rMat=matrixHTML(allP,(a,b)=>a===b?null:rivals[a+'->'+b]||0,false);

  document.getElementById('page-ranking').innerHTML=`
    <p class="sl">Podio</p>${pod}
    <p class="sl">Estadísticas</p>${sg}
    <p class="sl">Ranking</p>${tbl}
    <div class="chart-box"><p class="sl" style="margin-bottom:1rem">% victorias</p>
      <div style="position:relative;height:${Math.max(180,ranking.length*26)}px">
        <canvas id="wc" role="img" aria-label="Porcentaje de victorias por jugador"></canvas></div></div>
    <p class="sl">Victorias como compañeros</p>
    <div class="matrix-box"><div class="matrix-scroll">${wMat}</div></div>
    <p class="sl" style="margin-top:1.5rem">Derrotas contra rivales</p>
    <div class="matrix-box"><div class="matrix-scroll">${rMat}</div></div>`;
}

function renderHistorial(fechas,mvps){
  const hKeys=Object.keys(fechas).reverse();
  let html='';
  hKeys.forEach((f,fi)=>{
    const ms=fechas[f],mvp=mvps[f];
    let mHtml='';
    if(mvp)mHtml+=`<div class="mvp-bar"><span class="mvp-label">⭐ MVP</span><span class="mvp-name">${mvp.name}</span><span class="mvp-stat">${mvp.wins} victorias de ${mvp.total} partidos</span></div>`;
    ms.forEach(m=>{
      const wA=m.g==='Pareja A';
      mHtml+=`<div class="match-row">
        <div class="${wA?'mt-w':'mt-l'}"><div class="tnames">${m.j1a} / ${m.j2a}</div></div>
        <div class="mscore">${m.sa} — ${m.sb}</div>
        <div class="${!wA?'mt-w':'mt-l'}"><div class="tnames tnames-r">${m.j1b} / ${m.j2b}</div></div>
      </div>`;
    });
    html+=`<div class="fecha-group">
      <div class="fecha-hdr">
        <span class="fecha-ttl">${f}</span>
        <span style="display:flex;align-items:center;gap:10px">
          <span style="font-size:11px;color:var(--muted)">${ms.length} partidos</span>
          <span class="fecha-tog">▼</span>
        </span>
      </div>
      <div class="fecha-body" style="display:${fi===0?'block':'none'}">${mHtml}</div>
    </div>`;
  });
  document.getElementById('page-historial').innerHTML=html;
}

function renderJugador(ranking){
  const btns=ranking.map(r=>`<button class="pbtn" data-p="${r.name}">${r.name}</button>`).join('');
  const glossHtml=`<div class="glossary">
    <p class="glossary-title">Glosario de estadísticas</p>
    ${GLOSSARY.map(g=>`<div class="glossary-item"><span class="g-term">${g.term}</span><span class="g-def">${g.def}</span></div>`).join('')}
  </div>`;
  document.getElementById('page-jugador').innerHTML=`<div class="player-btns">${btns}</div><div id="prof"></div>${glossHtml}`;
}

function initWinChart(ranking){
  if(chartInst){chartInst.destroy();chartInst=null;}
  const canvas=document.getElementById('wc');
  if(!canvas)return;
  chartInst=new Chart(canvas,{
    type:'bar',
    data:{labels:ranking.map(r=>r.name),datasets:[{data:ranking.map(r=>parseFloat(r.pct.toFixed(1))),backgroundColor:ranking.map(r=>pColor(r.pct)),borderRadius:5,borderSkipped:false}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.raw}%`}}},
      scales:{x:{min:0,max:90,ticks:{callback:v=>v+'%',color:'#555',font:{size:10}},grid:{color:'rgba(255,255,255,.04)'},border:{display:false}},
        y:{ticks:{color:'#ccc',font:{size:11,family:'DM Sans'}},grid:{display:false},border:{display:false}}}}
  });
}

function renderProfile(pname,ranking,rivals,allP,fechaKeys,evoData,mvps){
  if(profChartInst){profChartInst.destroy();profChartInst=null;}
  if(evoChartInst){evoChartInst.destroy();evoChartInst=null;}
  const r=ranking.find(x=>x.name===pname);if(!r)return;
  const dif=r.gf-r.ga,difStr=dif>=0?`+${dif}`:`${dif}`,dgr=r.dgr>=0?`+${r.dgr.toFixed(2)}`:r.dgr.toFixed(2);
  let wr='',wc=0,lr='',lc=0;
  allP.forEach(o=>{
    if(o===pname)return;
    const w=rivals[o+'->'+pname]||0,l=rivals[pname+'->'+o]||0;
    if(w>wc){wc=w;wr=o;}if(l>lc){lc=l;lr=o;}
  });
  const mvpTotal=Object.values(mvps).filter(m=>m.name===pname).length;
  function tip(t){return`<span class="tooltip-wrap"><i class="info-btn">i</i><span class="tooltip-box">${t}</span></span>`;}

  const cards=`<div class="profile-grid">
    <div class="profile-card"><p class="plabel">Posición</p><p class="pval">#${r.pos}</p><p class="psub">${r.pct.toFixed(1)}% efectividad</p></div>
    <div class="profile-card"><p class="plabel">Partidos</p><p class="pval">${r.tot}</p><p class="psub">${r.w}W / ${r.l}L</p></div>
    <div class="profile-card"><p class="plabel">Dif. games ${tip('Games a favor menos games en contra. Positivo = ganás más de los que perdés.')}</p><p class="pval" style="color:${dif>=0?'var(--green)':'var(--red)'}">${difStr}</p><p class="psub">${r.gf} favor / ${r.ga} contra</p></div>
    <div class="profile-card"><p class="plabel">DGR ${tip('Diferencia de games por partido. Normaliza la diferencia según cuántos partidos jugaste.')}</p><p class="pval" style="color:${r.dgr>=0?'var(--green)':'var(--red)'}">${dgr}</p><p class="psub">Dif. por partido</p></div>
    <div class="profile-card"><p class="plabel">PGPP ${tip('Promedio de games por partido (ambos lados). Mide el volumen de juego que generás.')}</p><p class="pval">${r.pgpp.toFixed(1)}</p><p class="psub">Games por partido</p></div>
    <div class="profile-card"><p class="plabel">Ratio G ${tip('Games a favor dividido games en contra. Mayor a 1 = ganás más games de los que perdés.')}</p><p class="pval">${r.ga>0?(r.gf/r.ga).toFixed(2):'—'}</p><p class="psub">A favor / en contra</p></div>
    <div class="profile-card"><p class="plabel">MVPs ⭐</p><p class="pval">${mvpTotal}</p><p class="psub">fecha${mvpTotal!==1?'s':''} como mejor jugador</p></div>
    ${wr?`<div class="profile-card"><p class="plabel">Mejor rival ${tip('Jugador contra quien más victorias acumulaste cuando estuvo en el equipo contrario.')}</p><p class="pval" style="font-size:16px">${wr}</p><p class="psub">${wc} victorias contra él</p></div>`:''}
    ${lr?`<div class="profile-card"><p class="plabel">Peor rival ${tip('Jugador contra quien más derrotas acumulaste cuando estuvo en el equipo contrario.')}</p><p class="pval" style="font-size:16px">${lr}</p><p class="psub">${lc} derrotas contra él</p></div>`:''}
  </div>`;

  const chData=r.res.slice(-10),chLabels=chData.map((_,i)=>`P${r.res.length-chData.length+i+1}`);
  const evoPos=evoData[pname]||[];
  const evoLabels=fechaKeys.slice(0,evoPos.length);
  const totalPlayers=Object.keys(evoData).length||1;

  document.getElementById('prof').innerHTML=cards+
    `<div class="chart-box"><p class="sl" style="margin-bottom:1rem">Últimos ${chData.length} resultados</p>
      <div style="position:relative;height:100px"><canvas id="pc" role="img" aria-label="Resultados recientes del jugador"></canvas></div></div>`+
    (evoPos.length>=2?`<div class="chart-box"><p class="sl" style="margin-bottom:1rem">Evolución del ranking</p>
      <div style="position:relative;height:160px"><canvas id="ec" role="img" aria-label="Evolución del ranking fecha a fecha"></canvas></div></div>`:'');

  profChartInst=new Chart(document.getElementById('pc'),{
    type:'bar',
    data:{labels:chLabels,datasets:[{data:chData.map(v=>v===1?1:-1),backgroundColor:chData.map(v=>v===1?'rgba(74,222,128,.7)':'rgba(248,113,113,.7)'),borderRadius:4,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw===1?' Victoria':' Derrota'}}},
      scales:{y:{min:-1.5,max:1.5,ticks:{display:false},grid:{color:'rgba(255,255,255,.04)'},border:{display:false}},
        x:{ticks:{color:'#555',font:{size:10}},grid:{display:false},border:{display:false}}}}
  });

  if(evoPos.length>=2&&document.getElementById('ec')){
    evoChartInst=new Chart(document.getElementById('ec'),{
      type:'line',
      data:{labels:evoLabels,datasets:[{data:evoPos,borderColor:'#f5c842',backgroundColor:'rgba(245,200,66,.08)',pointBackgroundColor:'#f5c842',pointRadius:4,tension:.3,fill:true,borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' Posición #'+c.raw}}},
        scales:{
          y:{reverse:true,min:1,max:totalPlayers,ticks:{stepSize:1,color:'#555',font:{size:10},callback:v=>'#'+v},grid:{color:'rgba(255,255,255,.04)'},border:{display:false}},
          x:{ticks:{color:'#555',font:{size:10}},grid:{display:false},border:{display:false}}
        }}
    });
  }
}

loadData();
</script>
</body>
</html>
