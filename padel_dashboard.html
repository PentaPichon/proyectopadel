<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padel Rankings</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222;
    --border: rgba(255,255,255,0.07);
    --text: #f0f0f0;
    --muted: #888;
    --gold: #f5c842;
    --silver: #b0b8c1;
    --bronze: #cd7f32;
    --green: #4ade80;
    --red: #f87171;
    --blue: #60a5fa;
    --orange: #fb923c;
    --accent: #f5c842;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  header {
    padding: 2.5rem 2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: .05em; color: var(--accent); line-height: 1; }
  .logo span { color: var(--text); }
  .subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .refresh-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit;
    transition: all .2s;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }

  .section-label {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: .1em;
    color: var(--muted); margin-bottom: 1rem; border-left: 3px solid var(--accent); padding-left: 10px;
  }

  /* Podio */
  .podium-wrap { display: flex; justify-content: center; align-items: flex-end; gap: 12px; margin-bottom: 2.5rem; }
  .podium-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .podium-avatar {
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; letter-spacing: .05em;
  }
  .av-1 { width: 64px; height: 64px; font-size: 22px; background: rgba(245,200,66,.15); color: var(--gold); border: 2px solid var(--gold); }
  .av-2 { width: 54px; height: 54px; font-size: 18px; background: rgba(176,184,193,.1); color: var(--silver); border: 2px solid var(--silver); }
  .av-3 { width: 48px; height: 48px; font-size: 16px; background: rgba(205,127,50,.1); color: var(--bronze); border: 2px solid var(--bronze); }
  .podium-name { font-size: 14px; font-weight: 600; }
  .podium-pct { font-size: 12px; color: var(--muted); }
  .podium-base { border-radius: 6px 6px 0 0; width: 72px; display: flex; align-items: center; justify-content: center; }
  .base-1 { height: 70px; background: rgba(245,200,66,.2); border: 1px solid rgba(245,200,66,.3); }
  .base-2 { height: 50px; background: rgba(176,184,193,.12); border: 1px solid rgba(176,184,193,.2); }
  .base-3 { height: 36px; background: rgba(205,127,50,.12); border: 1px solid rgba(205,127,50,.2); }
  .base-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; opacity: .6; }

  /* Stats grid */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 2rem; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem 1.1rem;
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .stat-val { font-size: 20px; font-weight: 600; color: var(--text); }
  .stat-val .hl { font-size: 13px; margin-left: 4px; }
  .hl-g { color: var(--green); }
  .hl-r { color: var(--red); }
  .hl-b { color: var(--blue); }

  /* Ranking table */
  .rank-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 2rem; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 500;
  }
  thead th.r { text-align: right; }
  thead th.c { text-align: center; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,.03); }
  tbody td { padding: 11px 14px; font-size: 13px; vertical-align: middle; }
  tbody td.r { text-align: right; }
  tbody td.c { text-align: center; }
  .rank-num { color: var(--muted); font-size: 12px; width: 20px; }
  .rank-name { font-weight: 600; font-size: 14px; }
  .pct-wrap { display: inline-flex; align-items: center; gap: 6px; }
  .pbar { width: 70px; height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
  .pbar-fill { height: 4px; border-radius: 2px; }
  .pct-text { font-size: 12px; color: var(--muted); min-width: 38px; }
  .dots { display: flex; gap: 3px; align-items: center; }
  .d { width: 8px; height: 8px; border-radius: 50%; }
  .d-w { background: var(--green); }
  .d-l { background: rgba(255,255,255,.15); }
  .streak { font-size: 11px; color: var(--muted); }
  .streak-icon-w { color: var(--green); font-size: 9px; }
  .streak-icon-l { color: var(--red); font-size: 9px; }
  .wl { font-size: 11px; color: var(--muted); }

  /* Chart */
  .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; margin-bottom: 2rem; }
  .chart-wrap { position: relative; width: 100%; }

  /* Matrix */
  .matrix-section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 1.5rem; }
  .matrix-header { padding: 1rem 1.25rem .5rem; }
  .matrix-scroll { overflow-x: auto; padding: 0 1.25rem 1.25rem; }
  .mtable { border-collapse: collapse; font-size: 11px; white-space: nowrap; }
  .mtable th { font-size: 10px; color: var(--muted); padding: 4px 7px; text-align: center; font-weight: 500; }
  .mtable td { padding: 4px 7px; text-align: center; border-radius: 3px; min-width: 30px; }
  .mtable .row-lbl { text-align: left; color: var(--text); font-weight: 500; padding-right: 12px; }
  .mtable .dash-cell { color: var(--border); }

  /* Loader / Error */
  .loader { text-align: center; padding: 4rem; color: var(--muted); }
  .loader-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin: 0 3px; animation: pulse 1.2s ease-in-out infinite; }
  .loader-dot:nth-child(2){ animation-delay: .2s; }
  .loader-dot:nth-child(3){ animation-delay: .4s; }
  @keyframes pulse { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }
  .error-box { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.2); border-radius: 12px; padding: 1.5rem; color: #fca5a5; line-height: 1.7; }
  .error-box strong { color: var(--red); }

  .updated { font-size: 11px; color: var(--muted); text-align: right; margin-top: 1rem; }

  @media(max-width: 520px) {
    .logo { font-size: 2.2rem; }
    main { padding: 1.25rem 1rem; }
    .pbar { width: 45px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Padel <span>Rankings</span></div>
    <div class="subtitle">Estadísticas en vivo · actualiza solo con cada partido</div>
  </div>
  <button class="refresh-btn" onclick="load()">↺ Actualizar</button>
</header>

<main>
  <div id="root">
    <div class="loader">
      <span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span>
      <p style="margin-top:1.5rem;font-size:14px">Cargando datos...</p>
    </div>
  </div>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycby2WfugbFIZLjzEwfK1olYYTCGdf4CoQEZ51n3ngq06jCCA3GP1HaaLMxSXbUge8UuO/exec';
let chartInst = null;

function initials(n){ const w=n.trim().split(' '); return w.length>1?w[0][0]+w[1][0]:n.slice(0,2); }
function pColor(p){ return p>=55?'#4ade80':p>=50?'#60a5fa':p>=45?'#fb923c':'#f87171'; }

async function load() {
  if(chartInst){ chartInst.destroy(); chartInst=null; }
  document.getElementById('root').innerHTML = `<div class="loader">
    <span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span>
    <p style="margin-top:1.5rem;font-size:14px">Conectando con Google Sheets...</p>
  </div>`;
  try {
    const res = await fetch(API);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(!Array.isArray(json)||!json.length) throw new Error('El script no devolvió datos');
    render(json);
  } catch(e) {
    document.getElementById('root').innerHTML = `
      <div class="error-box">
        <strong>No se pudo cargar el Sheet</strong><br><br>
        Error: ${e.message}<br><br>
        Verificá que en Apps Script:<br>
        • Implementación → "Cualquier persona" puede acceder<br>
        • El script está autorizado<br>
        • El nombre de la hoja es exactamente <code style="background:rgba(255,255,255,.1);padding:1px 5px;border-radius:3px">Hoja1</code><br><br>
        <button onclick="load()" style="background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);color:#fca5a5;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;margin-top:.5rem">Reintentar</button>
      </div>`;
  }
}

function render(rows) {
  const stats={}, pwins={}, plosses={};
  rows.forEach(r=>{
    const j1a=String(r['Jugador 1 (A)']||'').trim();
    const j2a=String(r['Jugador 2 (A)']||'').trim();
    const j1b=String(r['Jugador 1 (B)']||'').trim();
    const j2b=String(r['Jugador 2 (B)']||'').trim();
    const g=String(r['Ganador']||'').trim();
    if(!j1a||!j2a||!j1b||!j2b||!g) return;
    [j1a,j2a,j1b,j2b].forEach(p=>{ if(!stats[p]) stats[p]={w:0,l:0,res:[]}; });
    const winA=g==='Pareja A';
    [j1a,j2a].forEach(p=>{ stats[p].res.push(winA?1:0); winA?stats[p].w++:stats[p].l++; });
    [j1b,j2b].forEach(p=>{ stats[p].res.push(winA?0:1); winA?stats[p].l++:stats[p].w++; });
    const pa=[j1a,j2a].sort().join('|'), pb=[j1b,j2b].sort().join('|');
    if(!pwins[pa])pwins[pa]=0; if(!plosses[pa])plosses[pa]=0;
    if(!pwins[pb])pwins[pb]=0; if(!plosses[pb])plosses[pb]=0;
    if(winA){pwins[pa]++;plosses[pb]++;}else{plosses[pa]++;pwins[pb]++;}
  });

  const ranking=Object.keys(stats).map(p=>{
    const s=stats[p], tot=s.w+s.l, pct=tot>0?(s.w/tot)*100:0;
    let streak=0,st='w';
    for(let i=s.res.length-1;i>=0;i--){
      if(i===s.res.length-1){st=s.res[i]?'w':'l';streak=1;}
      else if((st==='w'&&s.res[i]===1)||(st==='l'&&s.res[i]===0))streak++;
      else break;
    }
    return{name:p,pct,w:s.w,l:s.l,tot,last5:s.res.slice(-5),streak,st};
  }).sort((a,b)=>b.pct-a.pct).map((r,i)=>({...r,pos:i+1}));

  const allP=ranking.map(r=>r.name);
  const top3=ranking.slice(0,3);
  const order=[1,0,2];
  const avCl=['av-1','av-2','av-3'], bCl=['base-1','base-2','base-3'];

  // Podio
  let podHtml='<div class="podium-wrap">';
  order.forEach(idx=>{
    if(!top3[idx])return;
    const r=top3[idx];
    podHtml+=`<div class="podium-item">
      <div class="podium-avatar ${avCl[idx]}">${initials(r.name)}</div>
      <span class="podium-name">${r.name}</span>
      <span class="podium-pct">${r.pct.toFixed(1)}%</span>
      <div class="podium-base ${bCl[idx]}"><span class="base-num">${idx+1}</span></div>
    </div>`;
  });
  podHtml+='</div>';

  const bestS=ranking.reduce((a,b)=>b.streak>a.streak?b:a);
  const mostP=ranking.reduce((a,b)=>b.tot>a.tot?b:a);
  let bestPair='',bestPW=0;
  Object.entries(pwins).forEach(([k,v])=>{if(v>bestPW){bestPW=v;bestPair=k;}});
  const totalP=Math.round(ranking.reduce((a,r)=>a+r.tot,0)/2);

  const statsHtml=`<div class="stats-grid">
    <div class="stat-card"><p class="stat-label">Líder</p><p class="stat-val">${ranking[0].name} <span class="hl hl-g">${ranking[0].pct.toFixed(1)}%</span></p></div>
    <div class="stat-card"><p class="stat-label">Racha activa</p><p class="stat-val">${bestS.name} <span class="hl ${bestS.st==='w'?'hl-g':'hl-r'}">x${bestS.streak}</span></p></div>
    <div class="stat-card"><p class="stat-label">Mejor pareja</p><p class="stat-val" style="font-size:15px">${bestPair.replace('|',' + ')} <span class="hl hl-g">${bestPW}W</span></p></div>
    <div class="stat-card"><p class="stat-label">Total partidos</p><p class="stat-val">${totalP} <span class="hl hl-b">jugados</span></p></div>
  </div>`;

  let tbody='';
  ranking.forEach(r=>{
    const dots=r.last5.map(w=>`<span class="d ${w?'d-w':'d-l'}"></span>`).join('');
    tbody+=`<tr>
      <td class="rank-num">${r.pos}</td>
      <td class="rank-name">${r.name}</td>
      <td class="r"><div class="pct-wrap">
        <span class="pbar"><span class="pbar-fill" style="width:${r.pct.toFixed(0)}%;background:${pColor(r.pct)}"></span></span>
        <span class="pct-text">${r.pct.toFixed(1)}%</span>
      </div></td>
      <td class="c"><div class="dots">${dots}</div></td>
      <td class="c"><span class="${r.st==='w'?'streak-icon-w':'streak-icon-l'}">▲</span> <span class="streak">${r.streak}</span></td>
      <td class="r wl">${r.w}W / ${r.l}L</td>
    </tr>`;
  });

  const tableHtml=`<div class="rank-table-wrap"><table>
    <thead><tr><th>#</th><th>Jugador</th><th class="r">% victorias</th><th class="c">Últimos 5</th><th class="c">Racha</th><th class="r">W/L</th></tr></thead>
    <tbody>${tbody}</tbody>
  </table></div>`;

  const chartHtml=`<div class="chart-container">
    <p class="section-label" style="margin-bottom:1rem">% victorias</p>
    <div class="chart-wrap" style="height:${Math.max(180,ranking.length*26)}px">
      <canvas id="wc" role="img" aria-label="Porcentaje de victorias por jugador"></canvas>
    </div>
  </div>`;

  document.getElementById('root').innerHTML=`
    <p class="section-label">Podio</p>
    ${podHtml}
    <p class="section-label">Estadísticas</p>
    ${statsHtml}
    <p class="section-label">Ranking</p>
    ${tableHtml}
    ${chartHtml}
    <p class="section-label">Victorias como compañeros</p>
    <div class="matrix-section"><div class="matrix-scroll"><div id="wmat"></div></div></div>
    <p class="section-label" style="margin-top:1.5rem">Derrotas como compañeros</p>
    <div class="matrix-section"><div class="matrix-scroll"><div id="lmat"></div></div></div>
    <p class="updated">Actualizado: ${new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</p>`;

  chartInst=new Chart(document.getElementById('wc'),{
    type:'bar',
    data:{
      labels:ranking.map(r=>r.name),
      datasets:[{data:ranking.map(r=>parseFloat(r.pct.toFixed(1))),
        backgroundColor:ranking.map(r=>pColor(r.pct)),borderRadius:5,borderSkipped:false}]
    },
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.raw}%`}}},
      scales:{
        x:{min:0,max:90,ticks:{callback:v=>v+'%',color:'#888',font:{size:10}},grid:{color:'rgba(255,255,255,0.05)'},border:{display:false}},
        y:{ticks:{color:'#ccc',font:{size:11,family:'DM Sans'}},grid:{display:false},border:{display:false}}
      }}
  });

  buildMatrix(allP,pwins,'wmat',true);
  buildMatrix(allP,plosses,'lmat',false);
}

function buildMatrix(allP,data,id,isWin){
  const vals=allP.map(a=>allP.map(b=>{
    if(a===b)return null;
    return data[[a,b].sort().join('|')]||0;
  }));
  const maxV=Math.max(...vals.flat().filter(v=>v!==null));
  const sh=allP.map(p=>p.length>6?p.slice(0,6):p);
  let h=`<table class="mtable"><thead><tr><th></th>`;
  sh.forEach(s=>h+=`<th>${s}</th>`);
  h+='</tr></thead><tbody>';
  allP.forEach((p,i)=>{
    h+=`<tr><td class="row-lbl">${p}</td>`;
    vals[i].forEach(v=>{
      if(v===null){h+=`<td class="dash-cell">—</td>`;return;}
      const al=maxV>0&&v>0?0.1+(v/maxV)*0.85:0;
      const bg=isWin?`rgba(74,222,128,${al.toFixed(2)})`:`rgba(248,113,113,${al.toFixed(2)})`;
      const col=v>maxV*.6?(isWin?'#052e16':'#450a0a'):(isWin?'#86efac':'#fca5a5');
      h+=`<td style="background:${bg};color:${v>0?col:'#444'};font-weight:${v>0?600:400}">${v}</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  document.getElementById(id).innerHTML=h;
}

load();
</script>
</body>
</html>
